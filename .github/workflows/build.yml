name: Build and Push

# Build only — this workflow deliberately does not deploy.
#
# The LKE API server sits behind an IP allowlist that GitHub-hosted runners
# cannot satisfy (their egress ranges are large and rotate). Pushing an image
# needs no cluster access, so CI stops there and deployment happens from an
# allowlisted machine via `make deploy`.
#
# If push-to-deploy becomes worth it, the two real options are a self-hosted
# runner inside the cluster, or a GitOps controller (Flux/Argo) that pulls from
# ghcr — neither needs inbound access to the API server.

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          DEBUG: "true"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/falldaysoft/localevents:latest
            ghcr.io/falldaysoft/localevents:${{ github.sha }}

      - name: Deployment reminder
        run: |
          echo "Image pushed: ghcr.io/falldaysoft/localevents:${{ github.sha }}"
          echo "Deploy from an allowlisted machine:"
          echo "  make deploy INSTANCE=<name> TAG=${{ github.sha }}"

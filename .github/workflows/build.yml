name: Build and Deploy

# Build once, deploy to every instance that asks for it.
#
# The build job is the reusable product's CI: checks, tests, and an image
# tagged with the full commit SHA. The deploy job knows nothing about any
# community: the instances it deploys, and where each one lives, are
# repository and environment configuration rather than anything in this file.
#
#   - Repository variable DEPLOY_INSTANCES: a JSON list of instance names,
#     e.g. ["mytown"]. Unset, and nothing deploys — a fork gets CI for free
#     and opts in to deployment when it is ready.
#   - One GitHub environment per instance, named after it, carrying:
#       DEPLOY_HOST      (variable) user@host of the VM, e.g. ubuntu@vm.example.org
#       DEPLOY_HOST_KEY  (variable) the VM's public host key, as a known_hosts
#                        line (`ssh-keyscan -t ed25519 <host>`), so the deploy
#                        verifies who it is talking to instead of trusting the
#                        first answer.
#       DEPLOY_KEY       (secret) a private key whose public half sits in the
#                        VM's authorized_keys with a forced command of
#                        ~/apps/<instance>/deploy.sh. The key can run that
#                        script and nothing else; the tag is the SSH command.
#
# Nothing else about the instance reaches CI. Its `.env` lives on the VM.

on:
  push:
    branches:
      - main
  # Lets you rebuild and redeploy HEAD without an empty commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Superseded builds are useless — only the newest image gets deployed. This
    # sits on the job rather than the workflow so that cancelling a stale build
    # never cancels a deploy that is already talking to the VM.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    # GITHUB_TOKEN defaults to read-only, and the resulting ghcr push fails with
    # a 403 that reads like an authentication problem rather than a permissions
    # one. `packages: write` is what actually makes the push work.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Mirrors `make check`. The missing-migration check earns its place here:
      # a model change without its migration passes every test and then fails
      # on the VM when the container migrates at start, which is a far more
      # expensive place to work it out.
      - name: System checks and missing migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "true"

      - name: Run tests
        run: python -m pytest -q
        env:
          DEBUG: "true"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # arm64 because that is what the VM is; amd64 kept so the image still
      # runs on an ordinary laptop or cloud box. An amd64-only image on an
      # arm64 host fails at `docker compose up` with an exec format error,
      # which is at least loud.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Derived from the repository rather than hardcoded so that a
          # community forking this pushes to *their* namespace and it simply
          # works — GITHUB_TOKEN only ever has rights to packages under the
          # repo's own owner. Here it resolves to
          # ghcr.io/falldaysoft/localevents, which is what the compose file
          # expects.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # No instances configured means a fork that has not opted in, not an error.
    if: vars.DEPLOY_INSTANCES != ''
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.DEPLOY_INSTANCES || '[]') }}

    environment:
      name: ${{ matrix.instance }}

    # One deploy per instance at a time, and never cancelled: a `compose up`
    # killed halfway leaves containers the next run has to untangle first.
    # A newer commit queues behind the running one and deploys after it.
    concurrency:
      group: deploy-${{ matrix.instance }}
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Deploy to the instance's VM
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          for v in DEPLOY_HOST DEPLOY_HOST_KEY DEPLOY_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "::error::environment '${{ matrix.instance }}' has no $v (see the comment at the top of this workflow)"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          # The forced command on the VM ignores what we ask to run and reads
          # the tag from SSH_ORIGINAL_COMMAND instead.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "${{ github.sha }}"

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.appName }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      restartPolicy: Never
      containers:
      - name: migrate
        image: {{ .Values.image }}
        command: ["python", "manage.py", "migrate", "--noinput"]
        envFrom:
        - secretRef:
            name: postgres-secret
        # The same environment as every other pod, not the database URL and a
        # throwaway SECRET_KEY this used to make do with. `migrate` is no
        # longer only schema work: core.apps syncs the django.contrib.sites row
        # from SITE_NAME and SITE_BASE_URL on post_migrate, and a job that
        # cannot see those settings writes the defaults — stamping "Local
        # Events" at localhost:8000 onto a live instance, which is worse than
        # the example.com it replaced and just as silent.
        env:
        {{- include "localevents.env" . | nindent 8 }}

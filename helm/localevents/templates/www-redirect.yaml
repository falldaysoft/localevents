apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}-www-redirect
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    # $request_uri, not a bare host. nginx's `return 301 https://example.org;`
    # discards the path, so www/events/spring-fair/ would land a visitor on the
    # homepage — and event links are the ones people actually share. The
    # variable is expanded by nginx, so the path and query survive the hop.
    # (configuration-snippet would be the other way to do this, but this
    # cluster sets allow-snippet-annotations=false.)
    nginx.ingress.kubernetes.io/permanent-redirect: "https://{{ .Values.host }}$request_uri"
spec:
  tls:
  - hosts:
    - www.{{ .Values.host }}
    secretName: {{ .Values.appName }}-www-tls-cert-prod
  rules:
  - host: www.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.appName }}
            port:
              name: http

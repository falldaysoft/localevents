apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}-www-redirect
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://{{ .Values.host }}"
spec:
  tls:
  - hosts:
    - www.{{ .Values.host }}
    secretName: {{ .Values.appName }}-www-tls-cert-prod
  rules:
  - host: www.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.appName }}
            port:
              name: http
